<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title></title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; background: #000;
      overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #player-frame {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: none; background: #000;
    }
    .loading-overlay {
      position: fixed; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center;
      z-index: 20; color: #e50914; font-size: 42px;
      transition: opacity 0.4s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loading-overlay">
    <i class="fa fa-spinner fa-spin"></i>
  </div>

  <iframe
    id="player-frame"
    src=""
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
    allowfullscreen
    webkitallowfullscreen
    mozallowfullscreen
    referrerpolicy="no-referrer"
  ></iframe>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type') || 'movie';
      const id = params.get('id') || '';
      const season = params.get('season') || '';
      const episode = params.get('episode') || '';

      // ✅ BLANGKONG TITLE
      document.title = '';

      const MOVIE_BASE = 'https://vidstuck.xyz/embed/movie/';
      const TV_BASE = 'https://vidstuck.xyz/embed/tv/';

      let embedURL = '';

      if (type === 'tv') {
        if (season && episode) {
          embedURL = `${TV_BASE}${id}/${season}/${episode}`;
        } else {
          embedURL = `${TV_BASE}${id}`;
        }
      } else {
        embedURL = `${MOVIE_BASE}${id}`;
      }

      // ✅ DAGDAG NA PARAMETERS PARA SA FULLSCREEN + HIDE TITLE
      const extraParams = [
        'autoplay=1',
        'muted=0',
        'playsinline=1',
        'subtitle=en',
        'sub_lang=en',
        'cc=1',
        'cc_lang=en',
        'sub=1',
        'caption=en',
        'captions=1',
        'default_subtitle=en',
        // Fullscreen + hide UI params (subukan natin lahat)
        'fullscreen=1',
        'hideTitle=1',
        'hide_title=1',
        'noTitle=1',
        'no_title=1',
        'title=0',
        'showTitle=0',
        'show_title=0',
        'controls=0',
        'hideUI=1',
        'hide_ui=1',
        'overlay=0',
        'showOverlay=0',
        'chromeless=1',
        'embed=1',
        'fs=1',
        'full=1'
      ];

      const separator = embedURL.includes('?') ? '&' : '?';
      embedURL = embedURL + separator + extraParams.join('&');

      const frame = document.getElementById('player-frame');
      frame.src = embedURL;

      // ============================================================
      // ✅ MGA POSTMESSAGE COMMANDS — subukan lahat ng posibleng API
      // ============================================================
      function sendAllCommands() {
        if (!frame.contentWindow) return;

        const commands = [
          // Subtitle commands
          { type: 'setSubtitle', lang: 'en', enabled: true },
          { type: 'subtitle', enabled: true, lang: 'en' },
          { type: 'enableSubtitle', lang: 'en' },
          { type: 'cc', enabled: true, lang: 'en' },
          { type: 'captions', enabled: true, lang: 'en' },

          // Fullscreen commands
          { type: 'fullscreen' },
          { action: 'fullscreen' },
          { event: 'fullscreen' },
          { type: 'enterFullscreen' },
          { action: 'enterFullscreen' },
          { event: 'enterFullscreen' },
          { type: 'requestFullscreen' },
          { action: 'requestFullscreen' },

          // Hide title / UI commands
          { type: 'hideTitle' },
          { action: 'hideTitle' },
          { event: 'hideTitle' },
          { type: 'hide_title' },
          { action: 'hide_title' },
          { type: 'toggleTitle', visible: false },
          { type: 'setTitleVisibility', visible: false },
          { type: 'hideOverlay' },
          { action: 'hideOverlay' },
          { type: 'hideUI' },
          { action: 'hideUI' },
          { type: 'toggleControls', visible: false },
          { type: 'hideControls' },
          { action: 'hideControls' },
          { type: 'chromeless' },
          { action: 'chromeless' },

          // Player commands
          { type: 'play' },
          { event: 'play' },
          { action: 'play' },

          // Vidstack-specific (vidstuck uses vidstack player)
          { type: 'vds-fullscreen-enter' },
          { type: 'vds-hide-title' },
          { type: 'vds-toggle-controls', visible: false },
          { event: 'vds-request-fullscreen' },
          { detail: { fullscreen: true } },
          { detail: { hidden: true } }
        ];

        commands.forEach(function(cmd) {
          try {
            frame.contentWindow.postMessage(cmd, '*');
          } catch (e) {}
        });
      }

      frame.addEventListener('load', function() {
        setTimeout(function() {
          document.getElementById('loading-overlay').classList.add('hidden');
        }, 600);

        // Ipadala agad
        sendAllCommands();
        setTimeout(sendAllCommands, 1000);
        setTimeout(sendAllCommands, 2500);
        setTimeout(sendAllCommands, 5000);
      });

      setTimeout(function() {
        document.getElementById('loading-overlay').classList.add('hidden');
      }, 4000);

      // ============================================================
      // ✅ LISTEN SA MGA RESPONSE NG IFRAME
      // ============================================================
      window.addEventListener('message', function(event) {
        const data = event.data;
        if (!data) return;
        if (typeof data === 'object') {
          if (data.event === 'ready' || data.type === 'ready') {
            sendAllCommands();
          }
        }
      });

      // ============================================================
      // ✅ FULLSCREEN LISTENER — kapag pumasok sa fullscreen, i-apply lahat
      // ============================================================
      function onFullscreenChange() {
        const isFullscreen = document.fullscreenElement ||
                            document.webkitFullscreenElement ||
                            document.mozFullScreenElement ||
                            document.msFullscreenElement;

        if (isFullscreen) {
          document.title = '';
          sendAllCommands();
          setTimeout(sendAllCommands, 300);
          setTimeout(sendAllCommands, 800);
          setTimeout(sendAllCommands, 1500);
          setTimeout(sendAllCommands, 3000);
        }
      }

      document.addEventListener('fullscreenchange', onFullscreenChange);
      document.addEventListener('webkitfullscreenchange', onFullscreenChange);
      document.addEventListener('mozfullscreenchange', onFullscreenChange);
      document.addEventListener('MSFullscreenChange', onFullscreenChange);

      // ✅ Ipadala din every 3 seconds kapag fullscreen
      setInterval(function() {
        const isFullscreen = document.fullscreenElement ||
                            document.webkitFullscreenElement;
        if (isFullscreen) {
          sendAllCommands();
        }
      }, 3000);

      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function() {});
      }

      console.log('[MobiFlix Player] Embed URL:', embedURL);
    })();
  </script>
</body>
</html>
