<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>MobiFlix Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #player-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #e50914;
      font-size: 42px;
      transition: opacity 0.4s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loading-overlay">
    <i class="fa fa-spinner fa-spin"></i>
  </div>

  <iframe
    id="player-frame"
    src=""
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
    allowfullscreen
    referrerpolicy="no-referrer"
  ></iframe>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type') || 'movie';
      const id = params.get('id') || '';
      const season = params.get('season') || '';
      const episode = params.get('episode') || '';

      const MOVIE_BASE = 'https://zxcstream.icu/watch/movie/';
      const TV_BASE = 'https://zxcstream.icu/watch/tv/';

      let embedURL = '';

      if (type === 'tv') {
        if (season && episode) {
          embedURL = `${TV_BASE}${id}/${season}/${episode}`;
        } else {
          embedURL = `${TV_BASE}${id}`;
        }
      } else {
        embedURL = `${MOVIE_BASE}${id}`;
      }

      // ✅ Auto-play — idagdag ang autoplay params
      const separator = embedURL.includes('?') ? '&' : '?';
      embedURL = embedURL + separator + 'autoplay=1&autoPlay=1&muted=0&playsinline=1';

      const frame = document.getElementById('player-frame');
      frame.src = embedURL;

      frame.addEventListener('load', function() {
        setTimeout(function() {
          document.getElementById('loading-overlay').classList.add('hidden');
        }, 600);
      });

      // Fallback: itago ang loading pagkatapos ng 4 seconds
      setTimeout(function() {
        document.getElementById('loading-overlay').classList.add('hidden');
      }, 4000);

      // ✅ I-try i-auto-play sa iframe kung posible
      frame.addEventListener('load', function() {
        try {
          // Subukang mag-send ng play command sa iframe (kung same-origin)
          frame.contentWindow.postMessage({ type: 'play' }, '*');
        } catch (e) {}
      });

      // I-lock sa landscape kung mobile
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function() {});
      }
    })();
  </script>
</body>
</html>
