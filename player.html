<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title></title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; background: #000;
      overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #player-frame {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: none; background: #000;
    }
    .loading-overlay {
      position: fixed; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center;
      z-index: 20; color: #e50914; font-size: 42px;
      transition: opacity 0.4s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loading-overlay">
    <i class="fa fa-spinner fa-spin"></i>
  </div>

  <iframe
    id="player-frame"
    src=""
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
    allowfullscreen
    webkitallowfullscreen
    mozallowfullscreen
    referrerpolicy="no-referrer"
  ></iframe>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type') || 'movie';
      const id = params.get('id') || '';
      const season = params.get('season') || '';
      const episode = params.get('episode') || '';

      // ✅ BLANGKONG TITLE para walang nakaharang
      document.title = '';

      const MOVIE_BASE = 'https://vidstuck.xyz/embed/movie/';
      const TV_BASE = 'https://vidstuck.xyz/embed/tv/';

      let embedURL = '';

      if (type === 'tv') {
        if (season && episode) {
          embedURL = `${TV_BASE}${id}/${season}/${episode}`;
        } else {
          embedURL = `${TV_BASE}${id}`;
        }
      } else {
        embedURL = `${MOVIE_BASE}${id}`;
      }

      const subtitleParams = [
        'autoplay=1',
        'muted=0',
        'playsinline=1',
        'subtitle=en',
        'sub_lang=en',
        'cc=1',
        'cc_lang=en',
        'sub=1',
        'caption=en',
        'captions=1',
        'default_subtitle=en'
      ];

      const separator = embedURL.includes('?') ? '&' : '?';
      embedURL = embedURL + separator + subtitleParams.join('&');

      const frame = document.getElementById('player-frame');
      frame.src = embedURL;

      function sendSubtitleCommands() {
        try {
          const commands = [
            { type: 'setSubtitle', lang: 'en', enabled: true },
            { type: 'subtitle', enabled: true, lang: 'en' },
            { type: 'enableSubtitle', lang: 'en' },
            { type: 'cc', enabled: true, lang: 'en' },
            { type: 'captions', enabled: true, lang: 'en' },
            { action: 'setSubtitle', language: 'en' },
            { type: 'play' }
          ];
          commands.forEach(function(cmd) {
            try { frame.contentWindow.postMessage(cmd, '*'); } catch (e) {}
          });
        } catch (e) {}
      }

      // ✅ FULLSCREEN + HIDE TITLE COMMANDS
      function sendFullscreenCommands() {
        try {
          const commands = [
            { type: 'fullscreen' },
            { action: 'fullscreen' },
            { event: 'fullscreen' },
            { type: 'hideTitle' },
            { action: 'hideTitle' },
            { type: 'hideUI' },
            { action: 'hideUI' },
            { type: 'toggleControls', visible: false },
            { action: 'hideOverlay' },
            { type: 'enterFullscreen' }
          ];
          commands.forEach(function(cmd) {
            try { frame.contentWindow.postMessage(cmd, '*'); } catch (e) {}
          });
        } catch (e) {}
      }

      frame.addEventListener('load', function() {
        setTimeout(function() {
          document.getElementById('loading-overlay').classList.add('hidden');
        }, 600);

        sendSubtitleCommands();
        setTimeout(sendSubtitleCommands, 1500);
        setTimeout(sendSubtitleCommands, 3000);
        setTimeout(sendSubtitleCommands, 5000);
      });

      setTimeout(function() {
        document.getElementById('loading-overlay').classList.add('hidden');
      }, 4000);

      window.addEventListener('message', function(event) {
        const data = event.data;
        if (!data) return;
        if (typeof data === 'object') {
          if (data.event === 'ready' || data.type === 'ready') {
            sendSubtitleCommands();
          }
        }
      });

      // ✅ FULLSCREEN LISTENER — kapag pumasok sa fullscreen, itago ang title
      function handleFullscreenChange() {
        const isFullscreen = document.fullscreenElement ||
                            document.webkitFullscreenElement ||
                            document.mozFullScreenElement ||
                            document.msFullscreenElement;

        if (isFullscreen) {
          // ✅ I-reset ang title
          document.title = '';
          // ✅ Ipadala ang commands sa iframe
          sendFullscreenCommands();
          // ✅ Ulitin para siguradong mahuli
          setTimeout(sendFullscreenCommands, 500);
          setTimeout(sendFullscreenCommands, 1500);
          setTimeout(sendFullscreenCommands, 3000);
        }
      }

      document.addEventListener('fullscreenchange', handleFullscreenChange);
      document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
      document.addEventListener('mozfullscreenchange', handleFullscreenChange);
      document.addEventListener('MSFullscreenChange', handleFullscreenChange);

      // ✅ Ipadala din ang commands every 5 seconds (para sa slow loaders)
      setInterval(function() {
        const isFullscreen = document.fullscreenElement ||
                            document.webkitFullscreenElement;
        if (isFullscreen) {
          sendFullscreenCommands();
        }
      }, 5000);

      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function() {});
      }

      console.log('[MobiFlix Player] Embed URL:', embedURL);
    })();
  </script>
</body>
</html>
