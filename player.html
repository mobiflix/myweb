<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>MobiFlix Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #player-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .top-bar.hidden { opacity: 0; pointer-events: none; }
    .top-bar button {
      pointer-events: auto;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
      font-family: inherit;
    }
    .top-bar button:hover {
      background: #e50914;
      border-color: #e50914;
    }
    .title-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      padding: 14px 18px;
      background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
      color: #fff;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .title-bar.hidden { opacity: 0; }
    .title-bar h1 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    .title-bar p {
      font-size: 12px;
      color: #bbb;
    }
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #e50914;
      font-size: 42px;
      transition: opacity 0.4s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    @media (max-width: 480px) {
      .title-bar h1 { font-size: 14px; }
      .title-bar p { font-size: 11px; }
      .top-bar button { padding: 7px 13px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loading-overlay">
    <i class="fa fa-spinner fa-spin"></i>
  </div>

  <div class="top-bar" id="top-bar">
    <button onclick="closePlayer()">
      <i class="fa fa-arrow-left"></i> Back
    </button>
  </div>

  <iframe
    id="player-frame"
    src=""
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
    allowfullscreen
    referrerpolicy="no-referrer"
  ></iframe>

  <div class="title-bar" id="title-bar">
    <h1 id="player-title">Loading...</h1>
    <p id="player-subtitle"></p>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type') || 'movie';
      const id = params.get('id') || '';
      const season = params.get('season') || '';
      const episode = params.get('episode') || '';
      const title = params.get('title') || 'MobiFlix';
      const year = params.get('year') || '';

      const MOVIE_BASE = 'https://zxcstream.icu/watch/movie/';
      const TV_BASE = 'https://zxcstream.icu/watch/tv/';

      let embedURL = '';

      if (type === 'tv') {
        if (season && episode) {
          embedURL = `${TV_BASE}${id}/${season}/${episode}`;
        } else {
          embedURL = `${TV_BASE}${id}`;
        }
      } else {
        embedURL = `${MOVIE_BASE}${id}`;
      }

      document.getElementById('player-frame').src = embedURL;
      document.getElementById('player-title').textContent = title;
      document.getElementById('player-subtitle').textContent =
        type === 'tv'
          ? (season && episode ? `Season ${season} • Episode ${episode}` : 'TV Show')
          : (year ? `Movie • ${year}` : 'Movie');

      const frame = document.getElementById('player-frame');
      frame.addEventListener('load', function() {
        setTimeout(function() {
          document.getElementById('loading-overlay').classList.add('hidden');
        }, 600);
      });

      setTimeout(function() {
        document.getElementById('loading-overlay').classList.add('hidden');
      }, 4000);

      let hideTimer = setTimeout(hideBars, 4000);

      function hideBars() {
        document.getElementById('top-bar').classList.add('hidden');
        document.getElementById('title-bar').classList.add('hidden');
      }

      function showBars() {
        document.getElementById('top-bar').classList.remove('hidden');
        document.getElementById('title-bar').classList.remove('hidden');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(hideBars, 4000);
      }

      document.addEventListener('mousemove', showBars);
      document.addEventListener('touchstart', showBars);

      window.closePlayer = function() {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      };

      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function() {});
      }
    })();
  </script>
</body>
</html>
