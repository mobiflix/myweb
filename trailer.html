<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MobiFlix Trailer</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .trailer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #0b0b0b;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
      z-index: 10;
    }

    .trailer-back-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 8px 18px;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      white-space: nowrap;
    }

    .trailer-back-btn:hover {
      background: #e50914;
      border-color: #e50914;
    }

    .trailer-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin: 0;
      text-align: center;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 12px;
    }

    .trailer-header-spacer {
      width: 80px;
      flex-shrink: 0;
    }

    .trailer-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .trailer-wrapper {
      position: relative;
      width: 100%;
      max-width: 1400px;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
    }

    .trailer-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .trailer-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #666;
      font-size: 14px;
      flex-direction: column;
      gap: 12px;
      z-index: 5;
    }

    .trailer-loading i {
      font-size: 32px;
      color: #e50914;
    }

    /* ===== FALLBACK PANEL ===== */
    .trailer-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b0b0b 0%, #1a0000 100%);
      padding: 40px 20px;
      text-align: center;
      z-index: 20;
    }

    .trailer-fallback-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #e50914;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(229,9,20,0.4);
    }

    .trailer-fallback-icon i {
      font-size: 36px;
      color: #fff;
    }

    .trailer-fallback h2 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }

    .trailer-fallback p {
      font-size: 15px;
      color: #aaa;
      margin-bottom: 28px;
      max-width: 400px;
      line-height: 1.5;
    }

    .trailer-fallback-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-watch-youtube {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: #ff0000;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      transition: 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn-watch-youtube:hover {
      background: #cc0000;
      transform: scale(1.03);
    }

    .btn-watch-youtube i {
      font-size: 20px;
    }

    .btn-go-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      transition: 0.2s;
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
    }

    .btn-go-back:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.4);
    }

    .trailer-error {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .trailer-error i {
      font-size: 48px;
      color: #e50914;
      margin-bottom: 16px;
      display: block;
    }

    .trailer-error p {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .trailer-error a {
      display: inline-block;
      padding: 12px 24px;
      background: #e50914;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: 0.2s;
    }

    .trailer-error a:hover {
      background: #ff0a16;
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .trailer-header { padding: 10px 12px; }
      .trailer-title { font-size: 14px; }
      .trailer-back-btn { padding: 7px 14px; font-size: 13px; }
      .trailer-header-spacer { width: 70px; }
      .trailer-fallback h2 { font-size: 18px; }
      .trailer-fallback p { font-size: 14px; }
      .btn-watch-youtube, .btn-go-back { padding: 12px 22px; font-size: 14px; }
    }

    @media (max-width: 480px) {
      .trailer-header-spacer { width: 60px; }
      .trailer-back-btn { padding: 6px 12px; font-size: 12px; }
      .trailer-fallback h2 { font-size: 16px; }
      .btn-watch-youtube, .btn-go-back { padding: 11px 18px; font-size: 13px; }
    }
  </style>
</head>

<body>

  <div class="trailer-header">
    <a href="index.html" class="trailer-back-btn" onclick="goBack(event)">
      <i class="fa fa-arrow-left"></i> Back
    </a>
    <h1 class="trailer-title" id="trailer-title">Trailer</h1>
    <div class="trailer-header-spacer"></div>
  </div>

  <div class="trailer-body">
    <div class="trailer-loading" id="trailer-loading">
      <i class="fa fa-spinner fa-spin"></i>
      <span>Loading trailer...</span>
    </div>

    <div class="trailer-wrapper" id="trailer-wrapper" style="display:none;">
      <iframe
        id="trailer-iframe"
        src=""
        frameborder="0"
        allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
        allowfullscreen
        referrerpolicy="no-referrer"
      ></iframe>
    </div>

    <!-- ===== FALLBACK PANEL (lalabas kung hindi mag-load ang trailer) ===== -->
    <div class="trailer-fallback" id="trailer-fallback" style="display:none;">
      <div class="trailer-fallback-icon">
        <i class="fa fa-film"></i>
      </div>
      <h2>Trailer Not Available</h2>
      <p>This trailer can't be played inside the app. Watch it directly on YouTube instead.</p>
      <div class="trailer-fallback-buttons">
        <a href="#" class="btn-watch-youtube" id="btn-watch-youtube" target="_blank" rel="noopener">
          <i class="fa-brands fa-youtube"></i> Watch on YouTube
        </a>
        <a href="index.html" class="btn-go-back" onclick="goBack(event)">
          <i class="fa fa-arrow-left"></i> Go Back
        </a>
      </div>
    </div>
  </div>

  <script>
    let fallbackTimer = null;
    let trailerLoaded = false;

    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function goBack(e) {
      e.preventDefault();
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    function showFallback() {
      if (trailerLoaded) return;
      const loading = document.getElementById('trailer-loading');
      const wrapper = document.getElementById('trailer-wrapper');
      const fallback = document.getElementById('trailer-fallback');

      if (loading) loading.style.display = 'none';
      if (wrapper) wrapper.style.display = 'none';
      if (fallback) fallback.style.display = 'flex';

      console.log('[MobiFlix Trailer] Fallback shown');
    }

    document.addEventListener('DOMContentLoaded', function() {
      const videoKey = getParam('key');
      const title = getParam('title');

      const iframe = document.getElementById('trailer-iframe');
      const loading = document.getElementById('trailer-loading');
      const wrapper = document.getElementById('trailer-wrapper');
      const titleEl = document.getElementById('trailer-title');
      const watchBtn = document.getElementById('btn-watch-youtube');

      if (title) {
        const decoded = decodeURIComponent(title);
        titleEl.textContent = decoded;
        document.title = decoded + ' — Trailer — MobiFlix';
      }

      if (!videoKey) {
        loading.style.display = 'none';
        document.getElementById('trailer-fallback').style.display = 'flex';
        return;
      }

      // I-set ang YouTube link para sa fallback button
      const youtubeURL = 'https://www.youtube.com/watch?v=' + videoKey;
      if (watchBtn) watchBtn.href = youtubeURL;

      // Buuin ang embed URL
      const embedURL = 'https://www.youtube.com/embed/' + videoKey +
        '?autoplay=1&rel=0&modestbranding=1&playsinline=1';

      console.log('[MobiFlix Trailer] Loading:', embedURL);

      // Simulan ang fallback timer — 5 segundo
      fallbackTimer = setTimeout(function() {
        if (!trailerLoaded) {
          console.log('[MobiFlix Trailer] Timeout — showing fallback');
          showFallback();
        }
      }, 5000);

      // I-load ang iframe
      iframe.src = embedURL;

      iframe.onload = function() {
        trailerLoaded = true;
        if (fallbackTimer) clearTimeout(fallbackTimer);

        loading.style.display = 'none';
        wrapper.style.display = 'block';

        console.log('[MobiFlix Trailer] Loaded ✅');

        // I-check kung may error sa loob ng iframe (limited lang ang kaya nating i-detect)
        // Karaniwan, kung may error 153, hindi talaga naglo-load ang iframe
        // Kaya nag-fa-fallback tayo kapag may error message na lumabas

        setTimeout(function() {
          // I-detect kung ang iframe ay blank/error
          try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            if (doc && doc.body && doc.body.innerHTML.length < 100) {
              // Masyadong maliit ang content — malamang error
              console.log('[MobiFlix Trailer] Empty iframe detected — showing fallback');
              showFallback();
            }
          } catch (e) {
            // Cross-origin — hindi natin ma-access ang content
            // Manatili sa iframe
          }
        }, 2000);
      };

      // I-handle ang iframe errors
      iframe.onerror = function() {
        console.log('[MobiFlix Trailer] Iframe error');
        showFallback();
      };
    });
  </script>

</body>
</html>
